# Copy to config/customer.yaml and replace these sample targets.
alert_only: true
reasoner: deterministic
state_dir: var

# Uncomment after setting this variable in .env or the process environment.
# notifications:
#   webhook_url_env: AI_SRE_WEBHOOK_URL

# Optional dead-man's-switch to detect when this monitoring process stops.
# heartbeat_url: https://hc-ping.com/your-uuid
# heartbeat_interval: 60

integrations:
  website:
    interval: 60
    targets:
      - name: homepage
        url: https://example.com
        expected_status: 200
        contains: Example Domain
        max_latency_ms: 2000
        timeout_seconds: 10
        failure_threshold: 2
      # Add health endpoints or more sites with unique names.

  github:
    interval: 300
    token_env: GITHUB_TOKEN
    repositories:
      - repo: abhay784/AI-SRE
        branch: main
        # Omit workflows to discover all active workflows (paginated).
        # workflows: [ci.yml]
