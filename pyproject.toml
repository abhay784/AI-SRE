[project]
name = "slopsaver"
version = "0.2.0"
description = "Self-hosted website and GitHub Actions monitoring with optional AI incident reasoning"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ai = ["claude-agent-sdk>=0.1.0"]
adapters = [
    "stripe>=9.0",
    "boto3>=1.34",
    "psycopg[binary]>=3.1",
    "dnspython>=2.6",
]
sandbox = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
ai-sre = "slopsaver.__main__:main"
slopsaver = "slopsaver.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["slopsaver*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
