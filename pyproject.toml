[project]
name = "ai-sre"
version = "0.3.0"
description = "Self-hosted website, GitHub Actions, and Prometheus monitoring with optional AI incident reasoning"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ai = ["claude-agent-sdk>=0.1.0"]
adapters = [
    "stripe>=9.0",
    "boto3>=1.34",
    "psycopg[binary]>=3.1",
    "dnspython>=2.6",
]
sandbox = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
ai-sre = "ai_sre.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ai_sre*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
