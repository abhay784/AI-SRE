# Fake restaurant stack. Build + load the image first:
#   docker build -t ai-sre-sandbox:latest sandbox/
#   kind load docker-image ai-sre-sandbox:latest --name ai-sre
#   kubectl apply -f sandbox/k8s/all.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api-gateway, labels: { app: api-gateway } }
spec:
  replicas: 1
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata: { labels: { app: api-gateway } }
    spec:
      containers:
        - name: gateway
          image: ai-sre-sandbox:latest
          imagePullPolicy: IfNotPresent
          env: [{ name: APP, value: gateway }]
          ports: [{ containerPort: 8000 }]
---
apiVersion: v1
kind: Service
metadata: { name: api-gateway }
spec:
  type: NodePort
  selector: { app: api-gateway }
  ports: [{ port: 8000, nodePort: 30080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: order-service, labels: { app: order-service } }
spec:
  replicas: 1
  selector: { matchLabels: { app: order-service } }
  template:
    metadata: { labels: { app: order-service } }
    spec:
      containers:
        - name: orders
          image: ai-sre-sandbox:latest
          imagePullPolicy: IfNotPresent
          env:
            - { name: APP, value: orders }
            - { name: DATABASE_URL, value: "postgresql://restaurant:restaurant@postgres:5432/restaurant" }
          ports: [{ containerPort: 8000 }]
---
apiVersion: v1
kind: Service
metadata: { name: order-service }
spec:
  type: NodePort
  selector: { app: order-service }
  ports: [{ port: 8000, nodePort: 30081 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: auth-service, labels: { app: auth-service } }
spec:
  replicas: 1
  selector: { matchLabels: { app: auth-service } }
  template:
    metadata: { labels: { app: auth-service } }
    spec:
      containers:
        - name: auth
          image: ai-sre-sandbox:latest
          imagePullPolicy: IfNotPresent
          env: [{ name: APP, value: auth }]
          ports: [{ containerPort: 8000 }]
---
apiVersion: v1
kind: Service
metadata: { name: auth-service }
spec:
  selector: { app: auth-service }
  ports: [{ port: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, labels: { app: postgres } }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          # Deliberately tiny pool so chaos scripts can exhaust it (PRD §9.4)
          args: ["-c", "max_connections=20"]
          env:
            - { name: POSTGRES_USER, value: restaurant }
            - { name: POSTGRES_PASSWORD, value: restaurant }
            - { name: POSTGRES_DB, value: restaurant }
          ports: [{ containerPort: 5432 }]
---
apiVersion: v1
kind: Service
metadata: { name: postgres }
spec:
  type: NodePort
  selector: { app: postgres }
  ports: [{ port: 5432, nodePort: 30432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: minio, labels: { app: minio } }
spec:
  replicas: 1
  selector: { matchLabels: { app: minio } }
  template:
    metadata: { labels: { app: minio } }
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data"]
          env:
            - { name: MINIO_ROOT_USER, value: ai-sre }
            - { name: MINIO_ROOT_PASSWORD, value: ai-sre123 }
          ports: [{ containerPort: 9000 }]
---
apiVersion: v1
kind: Service
metadata: { name: minio }
spec:
  type: NodePort
  selector: { app: minio }
  ports: [{ port: 9000, nodePort: 30900 }]
